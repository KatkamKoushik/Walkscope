version: 2
updates:
  # Maintain dependencies for npm packages across monorepo
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-native*"
          - "@react-native/*"
      tooling:
        patterns:
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
    ignore:
      # React and React Native are strictly pinned by Expo SDK 58 runtime compatibility
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # Prevent breaking major updates for TypeScript beyond Expo SDK 58 matrix
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
